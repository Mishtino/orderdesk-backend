name: Backend validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile backend
        run: python -m py_compile main.py
