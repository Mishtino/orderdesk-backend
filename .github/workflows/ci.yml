name: Backend validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci-orderdesk.db
      JWT_SECRET: ci-only-orderdesk-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Import application and verify CORS configuration
        run: |
          python - <<'PY'
          import main
          assert "https://orderdesk-ui.vercel.app" in main.FRONTEND_ORIGINS
          assert "https://orderdesk-ui-vortex-technologies.vercel.app" in main.FRONTEND_ORIGINS
          print("Application import and OrderDesk CORS allowlist passed")
          PY
